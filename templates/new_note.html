<!DOCTYPE html>	
</html>	
<head>
	<title>Meeting Notes</title>
	<meta charset="UTF-8">
	<link href="style.css" rel="stylesheet">
</head>
<body>
	<a href="/">Home</a>
	<a href="/new_note">New Meeting Notes</a>
	<a href="/notes">Past Meeting Notes</a>
	<a href="/weather">Weather forecast</a>
	<h1>New Meeting Note</h1>
	<form method="POST">
		<label>Date (e.g. 2026-08-31):</label><br>
		<input type="date" name="date"><br>
		<br>
		<label>Venue:</label><br>
		<input type="text" name="venue"><br>
		<br>
		<label>Meeting Notes: </label><br>
		<textarea id="meetingnotes" name="meetingnotes" rows="6" cols="50" ></textarea><br>
		<br>
		<label>Actions to take: </label><br>
		<textarea id="actionstotake" name="actionstotake" rows="6" cols="50" ></textarea><br>
		<br>
		<input type="submit" value="Submit">
	
	
	</form>
	

</body>



</html>
